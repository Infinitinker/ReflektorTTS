[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflektortts"
version = "0.4.0"
description = "Your apps, read aloud. Speaks the dialogue and subtitles of games and other apps, and can translate them if you like, lektor-style."
readme = "README.md"
authors = [{ name = "Infinitinker" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT", "tools/licenses/unicode-cldr.txt", "tools/licenses/dotnet-runtime.txt"]
requires-python = ">=3.13"
keywords = ["text-to-speech", "tts", "translation", "games", "subtitles", "accessibility", "lektor", "overlay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "aiohttp>=3.14",
    "comtypes>=1.4; sys_platform == 'win32'",
    "ctranslate2>=4.8",
    "jsonschema>=4.26",
    "num2words>=0.5.14",
    "numpy>=2.5",
    "pillow>=13.0",
    "piper-tts>=1.8",
    "platformdirs>=4.14",
    "psutil>=7.2",
    "pycaw>=20260927; sys_platform == 'win32'",
    "pystray>=0.19.5",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "regex>=2026.9",
    "sacremoses>=0.2",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5",
    "subword-nmt>=0.3.8",
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]

[project.urls]
Source = "https://github.com/Infinitinker/ReflektorTTS"
Issues = "https://github.com/Infinitinker/ReflektorTTS/issues"

[project.gui-scripts]
reflektortts-desktop = "reflektortts.desktop.__main__:main"

[project.entry-points."reflektortts.sources"]
memory = "reflektortts.sources.memory.plugin:PLUGIN"
avalanche = "reflektortts.sources.avalanche.plugin:PLUGIN"
vlc = "reflektortts.sources.vlc.plugin:PLUGIN"

[project.entry-points."reflektortts.downloads"]
piper = "reflektortts.downloads.piper:PLUGIN"
argos = "reflektortts.downloads.argos:PLUGIN"

[project.entry-points."reflektortts.tts_engines"]
piper = "reflektortts.tts.engines.piper:PLUGIN"
windows = "reflektortts.tts.engines.windows:PLUGIN"

[project.entry-points."reflektortts.stages"]
normalize = "reflektortts.stages.normalize.stage:PLUGIN"
pronounce = "reflektortts.stages.pronounce:PLUGIN"
replace = "reflektortts.stages.replace:PLUGIN"
tracker = "reflektortts.stages.tracker:PLUGIN"
translate = "reflektortts.stages.translate.stage:PLUGIN"

[project.optional-dependencies]
release = ["pyinstaller>=6.22"]
dev = [
    "babel>=2.18",
    "import-linter>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-jsonschema",
    "types-psutil",
    "types-regex",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The end-to-end test starts the desktop app, so it runs only when asked for: pytest -m e2e.
addopts = "-m 'not e2e'"
markers = ["e2e: the end-to-end test of the desktop app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

# The directions imports run in, as docs/architecture.md and CLAUDE.md describe them; lint-imports
# checks them.
[tool.importlinter]
root_package = "reflektortts"
# The system's own libraries are in the graph too, for the contract on platform code.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core runs headless: nothing outside the desktop app imports it"
type = "protected"
protected_modules = ["reflektortts.desktop"]
allowed_importers = []

[[tool.importlinter.contracts]]
name = "The desktop app follows the core through the local API and imports none of the core's parts"
type = "forbidden"
source_modules = ["reflektortts.desktop"]
# Left out, as what the desktop app shares with the core: the API's address and errors, the command
# line, which ReflektorTTS this is, the logs, the per-user folders and settings files, the languages
# and the kinds of download.
forbidden_modules = [
    "reflektortts.apps",
    "reflektortts.bus",
    "reflektortts.core",
    "reflektortts.downloads.argos",
    "reflektortts.downloads.cache",
    "reflektortts.downloads.http",
    "reflektortts.downloads.manager",
    "reflektortts.downloads.piper",
    "reflektortts.ducking",
    "reflektortts.entry_points",
    "reflektortts.events",
    "reflektortts.glossary",
    "reflektortts.integrations",
    "reflektortts.letters",
    "reflektortts.overlay",
    "reflektortts.pipeline",
    "reflektortts.process_memory",
    "reflektortts.profiles",
    "reflektortts.sinks",
    "reflektortts.sources",
    "reflektortts.staging",
    "reflektortts.stages",
    "reflektortts.tts",
]
# Only the desktop app's own imports are checked: the core, which it runs on a background thread, and
# the API's server module, which it takes the address and errors from, import the rest.
allow_indirect_imports = true
ignore_imports = [
    # The desktop app starts the core and stops it on quit.
    "reflektortts.desktop.core_thread -> reflektortts.core.coordinator",
]

[[tool.importlinter.contracts]]
name = "The desktop app's folders import one way, from the app at the top down to what it is built from"
type = "layers"
containers = ["reflektortts.desktop"]
layers = ["__main__", "application", "window | tray", "tabs", "api | widgets | panel | system"]

[[tool.importlinter.contracts]]
name = "The core's modules import one way, from its state at the top down to the parts it is built from"
type = "layers"
containers = ["reflektortts.core"]
layers = [
    "coordinator",
    "watching | profile_states | profile_settings",
    "reading | integration_control | source_errors",
]

[[tool.importlinter.contracts]]
name = "Plugins are found through their entry points: nothing else imports a plugin, nor one plugin another"
type = "protected"
protected_modules = [
    "reflektortts.sources.*",
    "reflektortts.stages.*",
    "reflektortts.tts.engines.*",
    "reflektortts.downloads.argos",
    "reflektortts.downloads.piper",
]
allowed_importers = []
ignore_imports = [
    # A download source installs what it downloads where its stage or engine finds it (docs/plugins.md).
    "reflektortts.downloads.argos -> reflektortts.stages.translate.model",
    "reflektortts.downloads.piper -> reflektortts.tts.engines.piper",
]

[[tool.importlinter.contracts]]
name = "Plugins use the core through the plugin contracts, never its running parts or its user interfaces"
type = "forbidden"
source_modules = [
    "reflektortts.sources",
    "reflektortts.stages",
    "reflektortts.tts.engines",
    "reflektortts.downloads.argos",
    "reflektortts.downloads.piper",
]
forbidden_modules = [
    "reflektortts.api",
    "reflektortts.bus",
    "reflektortts.core",
    "reflektortts.desktop",
    "reflektortts.downloads.manager",
    "reflektortts.ducking",
    "reflektortts.overlay",
    "reflektortts.pipeline.runner",
    "reflektortts.profiles.catalog",
    "reflektortts.sinks",
]
# Shared modules a plugin uses, such as the settings files, import some of these themselves.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The core uses only what tts/ shares with it: only tts/ imports the speech engines and the player"
type = "protected"
protected_modules = ["reflektortts.tts.engines", "reflektortts.tts.playback"]
allowed_importers = ["reflektortts.tts"]
ignore_imports = [
    # A download source installs what it downloads where its engine finds it (docs/plugins.md).
    "reflektortts.downloads.piper -> reflektortts.tts.engines.piper",
]

[[tool.importlinter.contracts]]
name = "Platform code stays in its platform modules: only they import the system's own libraries"
type = "protected"
protected_modules = ["comtypes", "pycaw", "winrt", "Xlib"]
allowed_importers = [
    "reflektortts.desktop.system.tray_host",
    "reflektortts.ducking.windows",
    "reflektortts.tts.engines.windows",
]

[[tool.mypy.overrides]]
module = ["sounddevice", "num2words", "ctranslate2", "sacremoses", "subword_nmt.*", "sentencepiece", "pycaw.*", "comtypes", "pystray", "PyInstaller.*", "onnxruntime", "pefile", "winrt.*", "Xlib.*"]
ignore_missing_imports = true
