[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflektortts"
version = "0.1.0"
description = "Your game, read aloud."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14",
    "jsonschema>=4.26",
    "num2words>=0.5.14",
    "piper-tts>=1.8",
    "platformdirs>=4.14",
    "psutil>=7.2",
    "pycaw>=20260927; sys_platform == 'win32'",
    "sounddevice>=0.5",
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
]

[project.entry-points."reflektortts.sources"]
memory = "reflektortts.sources.memory.plugin:PLUGIN"
avalanche = "reflektortts.sources.avalanche.plugin:PLUGIN"

[project.entry-points."reflektortts.tts_engines"]
piper = "reflektortts.tts.engines.piper:PLUGIN"
windows = "reflektortts.tts.engines.windows:PLUGIN"

[project.entry-points."reflektortts.stages"]
normalize = "reflektortts.stages.normalize.stage:PLUGIN"
replace = "reflektortts.stages.replace:PLUGIN"
tracker = "reflektortts.stages.tracker:PLUGIN"
translate = "reflektortts.stages.translate.stage:PLUGIN"

[project.optional-dependencies]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17", "types-jsonschema", "types-psutil"]
translate = ["ctranslate2>=4.8", "sacremoses>=0.2", "subword-nmt>=0.3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sounddevice", "num2words", "ctranslate2", "sacremoses", "subword_nmt.*", "pycaw.*", "comtypes"]
ignore_missing_imports = true
