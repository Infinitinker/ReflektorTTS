[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflektortts"
version = "0.1.0"
description = "Your game, read aloud."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26",
    "piper-tts>=1.8",
    "platformdirs>=4.14",
    "psutil>=7.2",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["mypy>=2.4", "pytest>=9.2", "ruff>=0.17", "types-jsonschema", "types-psutil"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sounddevice"]
ignore_missing_imports = true
