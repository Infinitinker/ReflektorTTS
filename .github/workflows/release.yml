name: Release

# A pushed tag v<version> on main builds the release and drafts its page, which a maintainer then
# completes and publishes. A run started by hand (Actions > Release > Run workflow, on any branch)
# does the same without drafting, to try a release before tagging it; it keeps the files on the
# run's page for 90 days. Each system's build is a workflow of its own (build-windows.yml), which also
# checks its files, and which builds every push and pull request on its own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A release's build is never cut short.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The history of main, to check that the tag is on it.
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      # Fails before anything is built, rather than drafting a release under the wrong name or from
      # code that was never merged.
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the version in pyproject.toml is $VERSION."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge dev into main and tag the commit on main."
            exit 1
          fi

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/build-windows.yml

  draft:
    name: Draft the release
    needs: [version, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # To create the release.
      id-token: write # To sign the provenance attestations.
      attestations: write # To store them.
    steps:
      # skip-decompress keeps each file as uploaded: otherwise the two zips would arrive unpacked.
      - uses: actions/download-artifact@v8
        with:
          pattern: ReflektorTTS-*
          merge-multiple: true
          skip-decompress: true
          path: release
      # Records that these files were built by this workflow from this commit, so anyone can check a
      # download with: gh attestation verify <file> --repo Infinitinker/ReflektorTTS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          {
            echo "Describe the release here, then publish it."
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            sha256sum -- *
            echo '```'
            echo
            echo "Each file's build can be checked with the [GitHub CLI](https://cli.github.com/):"
            echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ReflektorTTS $VERSION" --notes-file "$RUNNER_TEMP/notes.md" -- *
