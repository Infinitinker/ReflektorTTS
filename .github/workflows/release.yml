name: Release

# A pushed tag v<version> on main builds the release and drafts its page, which a maintainer then
# completes and publishes. Pull requests that change how a release is built build and check one too;
# a run started by hand builds and checks one to try. Those keep the files on the run's page for
# 90 days. Each system's build is a workflow of its own (build-windows.yml), which runs on its own
# for pushes and pull requests too.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build-*.yml
      - native/**
      - pyproject.toml
      - tools/build_release.py
      - tools/installer.iss
      - tools/licenses/**
      - tools/notices.py
      - tools/release-constraints.txt
      - tools/sources.py
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a pull request replaces its build; a release's build is never cut short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The history of main, to check that the tag is on it.
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      # Fails before anything is built, rather than drafting a release under the wrong name or from
      # code that was never merged.
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the version in pyproject.toml is $VERSION."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge dev into main and tag the commit on main."
            exit 1
          fi

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/build-windows.yml

  files:
    name: Check the files
    needs: [version, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # skip-decompress keeps each file as uploaded: otherwise the two zips would arrive unpacked.
      - uses: actions/download-artifact@v8
        with:
          pattern: ReflektorTTS-*
          merge-multiple: true
          skip-decompress: true
          path: release
      - name: Check the files
        working-directory: release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l
          expected=$(printf '%s\n' "ReflektorTTS-$VERSION-windows-x64-setup.exe" \
            "ReflektorTTS-$VERSION-windows-x64.zip" "ReflektorTTS-$VERSION-sources.zip" | LC_ALL=C sort)
          if [ "$(ls -1 | LC_ALL=C sort)" != "$expected" ]; then
            echo "::error::Expected exactly these files:" $expected
            exit 1
          fi
          for file in $expected; do
            [ -f "$file" ] || { echo "::error::$file did not arrive as a file."; exit 1; }
          done
          for zip in *.zip; do
            unzip -tq "$zip" || { echo "::error::$zip is not a whole zip."; exit 1; }
          done

  draft:
    name: Draft the release
    needs: [version, files]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # To create the release.
      id-token: write # To sign the provenance attestations.
      attestations: write # To store them.
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ReflektorTTS-*
          merge-multiple: true
          skip-decompress: true
          path: release
      # Records that these files were built by this workflow from this commit, so anyone can check a
      # download with: gh attestation verify <file> --repo Infinitinker/ReflektorTTS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          {
            echo "Describe the release here, then publish it."
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            sha256sum -- *
            echo '```'
            echo
            echo "Each file's build can be checked with the [GitHub CLI](https://cli.github.com/):"
            echo "\`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ReflektorTTS $VERSION" --notes-file "$RUNNER_TEMP/notes.md" -- *
