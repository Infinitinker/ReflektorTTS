name: Build Windows app

# Builds the Windows release files: the installer, the Windows zip and the sources zip, each kept on
# the run's page under its release file name, and checks them. The Release workflow (release.yml)
# calls it and drafts the release from them; run on its own, it shows early that a change still builds.
#
# It runs for every pull request (also Dependabot's and those from forks), from the Release workflow,
# and on demand (Actions > Build Windows app > Run workflow, on any branch); not for pushes, so a
# change is built once, in its pull request, rather than on every push to dev. Its build job is a
# required status check of the main branch ruleset, with the Checks workflow's jobs ("Branches" in
# docs/development.md).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request cancels the build still going for the older one; a release's build
# is never cut short.
# Called from release.yml, github.workflow is "Release".
concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow != 'Release' }}

permissions:
  contents: read

env:
  # Inno Setup's installer, checked against the SHA-256 that its release on GitHub lists.
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0

jobs:
  build:
    name: Windows build (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      # The three files, so the check downloads exactly these, whatever else the run builds.
      artifacts: ${{ steps.setup.outputs.artifact-id }},${{ steps.windows-zip.outputs.artifact-id }},${{ steps.sources.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      # Both toolchains, as in native/README.md: the 32-bit overlay is for 32-bit apps. MSYS2 calls
      # MINGW32 deprecated, with no replacement for 32-bit builds, and only warns about it.
      - uses: ./.github/actions/msys2
        with:
          packages: mingw-w64-i686-toolchain mingw-w64-i686-cmake mingw-w64-i686-ninja
      # The presets in native/CMakePresets.json, into native/build and native/build64, where
      # tools/build_release.py looks for the files.
      - name: Build the 32-bit overlay
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW32
        run: |
          cmake -S native --preset release-x86
          cmake --build native/build
      - name: Build the 64-bit overlay and the settings window
        shell: msys2 {0}
        run: |
          cmake -S native --preset release
          cmake --build native/build64

      # The exact Python a release ships, as THIRD-PARTY-NOTICES.md holds its license; changed together
      # with tools/release-constraints.txt and the notices.
      - uses: ./.github/actions/python
        with:
          python-version: "3.13.16"
          cache-dependency-path: tools/release-constraints.txt
      - name: Install
        run: python -m pip install -e .[release] -c tools/release-constraints.txt

      - name: Install Inno Setup
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $folder = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Invoke-WebRequest $env:INNO_SETUP_URL -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup's installer has the SHA-256 $hash, not $env:INNO_SETUP_SHA256." }
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$folder" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup's installer failed with exit code $($setup.ExitCode)." }
          "ISCC=$(Join-Path $folder 'ISCC.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the release
        run: python tools/build_release.py
      # Each file on its own and unzipped, so the run's page offers the files themselves. Each step
      # fails unless its pattern matches exactly one file.
      - id: setup
        uses: actions/upload-artifact@v7
        with:
          path: build/release/*-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
      - id: windows-zip
        uses: actions/upload-artifact@v7
        with:
          path: build/release/*-windows-x64.zip
          archive: false
          if-no-files-found: error
      - id: sources
        uses: actions/upload-artifact@v7
        with:
          path: build/release/*-sources.zip
          archive: false
          if-no-files-found: error

  files:
    name: Windows release files
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # skip-decompress keeps each file as uploaded: otherwise the two zips would arrive unpacked.
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifacts }}
          merge-multiple: true
          skip-decompress: true
          path: ${{ runner.temp }}/release
      - name: Check the files
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l
          expected=$(printf '%s\n' "ReflektorTTS-$VERSION-windows-x64-setup.exe" \
            "ReflektorTTS-$VERSION-windows-x64.zip" "ReflektorTTS-$VERSION-sources.zip" | LC_ALL=C sort)
          if [ "$(ls -1 | LC_ALL=C sort)" != "$expected" ]; then
            echo "::error::Expected exactly these files:" $expected
            exit 1
          fi
          for file in $expected; do
            [ -f "$file" ] || { echo "::error::$file did not arrive as a file."; exit 1; }
          done
          for zip in *.zip; do
            unzip -tq "$zip" || { echo "::error::$zip is not a whole zip."; exit 1; }
          done
