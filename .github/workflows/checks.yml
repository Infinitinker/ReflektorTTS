name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check
      - name: Format
        run: python -m ruff format --check
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libraries
        # PortAudio plays sound; Xvfb gives the window's tests a display.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Tests
        run: xvfb-run -a python -m pytest
