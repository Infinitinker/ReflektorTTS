name: Checks

# Pushes to the two long-lived branches, and pull requests, also from forks.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ruff's results are the same on every system, so it runs once, on the fastest runner.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check
      - name: Format
        run: python -m ruff format --check

  # mypy checks only the code paths of the system it runs on, and the Windows-only packages are
  # installed only on Windows, so types are checked on each system, like the tests.
  system:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libraries
        if: runner.os == 'Linux'
        # PortAudio plays sound; Xvfb gives the window's tests a display.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Types
        run: python -m mypy
      - name: Tests
        if: runner.os == 'Windows'
        run: python -m pytest
      - name: Tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest
