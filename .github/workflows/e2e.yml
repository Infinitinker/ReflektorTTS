name: E2E tests

# The end-to-end smoke test of the desktop app (tests/e2e, "End-to-end tests" in docs/development.md),
# run from source on Windows and Linux. For pushes to the two long-lived branches and for pull
# requests, like the Checks; its jobs have short, fixed names, different from the Checks jobs. Also on
# request (Actions > E2E tests > Run workflow, on any branch), to run the test on a branch that has no
# pull request, or again on its own after a run that failed for reasons outside the change.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.name }} E2E tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python
      # The report, the logs and the screenshot (tests/e2e/folders.py). The runner context cannot be
      # used in a job-level env.
      - name: Output folder
        run: echo "E2E_OUTPUT=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
      # PortAudio plays sound; Xvfb is the screen, and stalonetray a tray on it for the app's icon.
      - uses: ./.github/actions/linux-libraries
        if: runner.os == 'Linux'
        with:
          packages: stalonetray
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run the smoke test
        if: runner.os == 'Windows'
        run: python -m pytest -m e2e
      # The tray must be up before the app starts, which looks for it once. The screen has a fixed size,
      # that of a common desktop (Full HD, in full color), rather than xvfb-run's default, which is up
      # to the Ubuntu release: the app's window then fits as on a user's screen, and the screenshot in
      # the output folder shows it as a user would see it.
      - name: Run the smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'stalonetray & python -m tests.e2e.wait_for_tray && python -m pytest -m e2e'
      - name: Job summary
        if: always()
        run: |
          { echo "### ${{ matrix.name }}"; echo '```json'; cat "$E2E_OUTPUT/report.json" || echo '{"report": "missing"}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.name }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14
